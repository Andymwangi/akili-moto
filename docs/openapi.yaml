openapi: 3.1.0
info:
  title: Akili Moto API
  version: 0.1.0
  description: Daily shared trivia challenge. The server owns question order, scoring, and leaderboard ranks.
servers:
  - url: https://neno-word-game-production.andymwangi3.workers.dev/api
    description: Planned production origin; not deployed
  - url: http://localhost:5173/api
    description: Local development
security:
  - playerCookie: []
paths:
  /health:
    get:
      summary: Check API availability
      responses:
        "200":
          description: Worker is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /quiz:
    get:
      summary: Get or resume today's quiz
      description: The server determines the date and returns only the current unanswered question for the requested round. Round two unlocks after round one is complete.
      parameters:
        - in: query
          name: round
          required: false
          schema: { type: string, enum: ["1", "2"], default: "1" }
      responses:
        "200":
          description: Quiz state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /quiz/answer:
    post:
      summary: Submit the current question's choice
      description: The server validates question order, calculates correctness and points, then returns feedback for the answered question. The client cannot submit scores or choose the day.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 100
            pattern: "^[A-Za-z0-9._~-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswerRequest"
      responses:
        "200":
          description: Updated quiz state with feedback for the submitted answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizState"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Quiz complete, answer already recorded, stale or unopened question (question_not_opened), timeout sent before the deadline (answer_too_early), or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Request Origin is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Answer rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /quiz/leaderboard:
    get:
      summary: Get today's completed-player leaderboard
      description: Scores are server computed. Equal scores share rank. Display names are returned, but player IDs are not.
      responses:
        "200":
          description: Top completed scores and the current player's rank, if finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizLeaderboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /player:
    get:
      summary: Get or create the signed-in player's profile
      description: A recovery code is returned only when the profile is first created or the code is rotated.
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /player/name:
    patch:
      summary: Change the signed-in player's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 2, maxLength: 24 }
      responses:
        "200":
          description: Updated player profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "409":
          description: Display name is already in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Request Origin is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /player/recovery-code:
    post:
      summary: Rotate the player's recovery code
      description: The new code is returned once; the previous code becomes invalid.
      responses:
        "200":
          description: Profile and new recovery code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "403":
          description: Request Origin is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /player/recover:
    post:
      summary: Restore a player identity with its recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recoveryCode]
              properties:
                recoveryCode: { type: string, minLength: 40, maxLength: 47 }
      responses:
        "200":
          description: Restored player profile and signed cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerProfile" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404":
          description: Recovery code not recognized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Recovery rate limit exceeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Request Origin is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /player/history:
    get:
      summary: List the signed-in player's completed games
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: before
          schema: { type: string, format: date }
      responses:
        "200":
          description: Player-scoped history page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlayerHistory" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    playerCookie:
      type: apiKey
      in: cookie
      name: neno_player
      description: Signed anonymous identity cookie set by the Worker.
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    QuizAnswerRequest:
      type: object
      additionalProperties: false
      required: [round, questionId]
      properties:
        round: { type: integer, enum: [1, 2] }
        questionId: { type: string, minLength: 1, maxLength: 64 }
        selectedOptionId: { type: string, enum: [a, b, c, d], description: Omit only to submit after the server-timed 30-second answer deadline. }
    QuizQuestion:
      type: object
      additionalProperties: false
      required: [id, language, difficulty, prompt, options]
      properties:
        id: { type: string }
        language: { type: string, enum: [en, sw] }
        difficulty: { type: string, enum: [medium, challenging, hard, very_hard] }
        prompt: { type: string }
        options:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [id, text]
            properties:
              id: { type: string, enum: [a, b, c, d] }
              text: { type: string }
    QuizFeedback:
      allOf:
        - $ref: "#/components/schemas/QuizQuestion"
        - type: object
          required:
            [
              questionIndex,
              selectedOptionId,
              correctOptionId,
              isCorrect,
              points,
              explanation,
              sourceUrl,
            ]
          properties:
            questionIndex: { type: integer, minimum: 0, maximum: 14 }
            selectedOptionId: { type: [string, "null"], enum: [a, b, c, d, null] }
            correctOptionId: { type: string, enum: [a, b, c, d] }
            isCorrect: { type: boolean }
            points: { type: integer, minimum: 0, maximum: 400 }
            explanation: { type: string }
            sourceUrl: { type: string, format: uri }
    QuizState:
      type: object
      required:
        [day, round, status, currentIndex, totalQuestions, score, correctCount, startedAt, answers]
      properties:
        day: { type: string, format: date }
        round: { type: integer, enum: [1, 2] }
        status: { type: string, enum: [in_progress, finished] }
        currentIndex: { type: integer, minimum: 0, maximum: 15 }
        totalQuestions: { type: integer, enum: [10, 15] }
        score: { type: integer, minimum: 0, maximum: 3200 }
        correctCount: { type: integer, minimum: 0, maximum: 15 }
        startedAt: { type: string, format: date-time }
        currentQuestionOpenedAt: { type: string, format: date-time }
        currentQuestionTimeRemainingMs: { type: integer, minimum: 0, maximum: 30000 }
        bonusQuestionIndex: { type: integer, minimum: 0, maximum: 14, description: Zero-based index of the round's bonus question; absent for legacy 10-question rounds. }
        currentQuestion:
          description: Returned only by GET /quiz, which also starts the question timer. Answer responses omit it.
          allOf: [{ $ref: "#/components/schemas/QuizQuestion" }]
        answers:
          type: array
          maxItems: 15
          items: { $ref: "#/components/schemas/QuizFeedback" }
        rank: { type: integer, minimum: 1 }
        completedPlayers: { type: integer, minimum: 0 }
    QuizLeaderboard:
      type: object
      required: [day, rounds, combined]
      properties:
        day: { type: string, format: date }
        rounds:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/RoundLeaderboard" }
        combined: { $ref: "#/components/schemas/CombinedLeaderboard" }
    RoundLeaderboard:
      type: object
      required: [round, totalPlayers, playerRank, playerScore, items]
      properties:
        round: { type: integer, enum: [1, 2] }
        totalPlayers: { type: integer, minimum: 0 }
        playerRank: { type: [integer, "null"], minimum: 1 }
        playerScore: { type: [integer, "null"], minimum: 0, maximum: 3200 }
        items:
          { type: array, maxItems: 20, items: { $ref: "#/components/schemas/LeaderboardItem" } }
    CombinedLeaderboard:
      type: object
      required: [totalPlayers, playerRank, playerScore, items]
      properties:
        totalPlayers: { type: integer, minimum: 0 }
        playerRank: { type: [integer, "null"], minimum: 1 }
        playerScore: { type: [integer, "null"], minimum: 0, maximum: 6400 }
        items:
          { type: array, maxItems: 20, items: { $ref: "#/components/schemas/LeaderboardItem" } }
    LeaderboardItem:
      type: object
      required: [position, rank, score, correctCount, displayName]
      properties:
        position: { type: integer, minimum: 1 }
        rank: { type: integer, minimum: 1 }
        displayName: { type: string, minLength: 1, maxLength: 24 }
        score: { type: integer, minimum: 0, maximum: 2400 }
        correctCount: { type: integer, minimum: 0, maximum: 20 }
    PlayerProfile:
      type: object
      additionalProperties: false
      required: [playerId, displayName]
      properties:
        playerId: { type: string, format: uuid }
        displayName: { type: string, minLength: 2, maxLength: 24 }
        recoveryCode: { type: string, pattern: "^(?:[A-F0-9]{5}-){7}[A-F0-9]{5}$" }
    PlayerHistory:
      type: object
      additionalProperties: false
      required: [items, nextBefore]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [day, roundsCompleted, score, correctCount, completedAt]
            properties:
              day: { type: string, format: date }
              roundsCompleted: { type: integer, minimum: 1, maximum: 2 }
              score: { type: integer, minimum: 0, maximum: 2400 }
              correctCount: { type: integer, minimum: 0, maximum: 20 }
              completedAt: { type: string, format: date-time }
        nextBefore: { type: [string, "null"], format: date }
  responses:
    InvalidRequest:
      description: Invalid headers or answer payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Route is not on the public allowlist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unavailable:
      description: Temporary database or quiz-content failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
